name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          echo "Files in repository:"
          ls -lah
          
          if [ ! -f "DustinBotV1_V1_2.zip" ]; then
            echo "ERROR: DustinBotV1_V1_2.zip not found"
            exit 1
          fi

          echo "Using: DustinBotV1_V1_2.zip"

      - name: Unzip project
        run: |
          rm -rf project
          mkdir -p project
          unzip -o "DustinBotV1_V1_2.zip" -d project

          echo "=== Extracted files ==="
          find project -maxdepth 5 -type f | sort

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          find "${PROJECT_DIR}/app/build/outputs/apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV1-APK-V1.2
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
