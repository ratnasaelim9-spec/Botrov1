name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ไม่พบไฟล์ ZIP"
            exit 1
          fi

          echo "ใช้ไฟล์: $ZIP"
          unzip -q "$ZIP" -d project

          echo "ตรวจสอบโครงสร้าง:"
          find project -maxdepth 3 -type f | head -100

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew || true
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
