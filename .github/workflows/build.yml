name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -o DustinBotV1_UI_READY_GitHub.zip -d project
          echo "=== Extracted files ==="
          find project -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -type f | head -1)")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix Kotlin duplicate dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("${PROJECT_DIR}") / "app" / "build.gradle"

          if p.exists():
              s = p.read_text()

              s += """
          
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          """

              p.write_text(s)
              print("Kotlin duplicate dependency fix applied.")
          else:
              print("build.gradle not found:", p)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV1-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
