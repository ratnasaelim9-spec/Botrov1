name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Kotlin dependency fix
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/fix.gradle" <<'EOF'
          allprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                  }
              }
          }
          EOF

          echo "fix.gradle created:"
          ls -l "$RUNNER_TEMP/fix.gradle"

      - name: Find V1.3 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "DustinBotV1*V1.3*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V1.3 ZIP not found."
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          echo "===== EXTRACTED FILES ====="
          find project -maxdepth 6 -type f -print

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find project -maxdepth 8 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "===== GRADLE PROJECT ====="
          echo "$PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "===== BUILDING ====="
          echo "Project: $PROJECT_DIR"
          echo "Fix script: $RUNNER_TEMP/fix.gradle"

          test -f "$RUNNER_TEMP/fix.gradle"
          test -f "$PROJECT_DIR/settings.gradle" || \
            test -f "$PROJECT_DIR/settings.gradle.kts"

          gradle \
            -p "$PROJECT_DIR" \
            --init-script "$RUNNER_TEMP/fix.gradle" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          echo "===== APK FILES ====="

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -ls

          APK=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK SUCCESS:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV1-V1.3-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
