name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and unzip project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบไฟล์ ZIP"
            exit 1
          fi

          echo "พบ ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "ไฟล์หลังแตก ZIP:"
          find project -maxdepth 4 -type f | head -100

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(dirname "$(find project -type f -name "settings.gradle" -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: ไม่พบ settings.gradle"
            find project -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "ตรวจสอบไฟล์:"
          ls -la "$PROJECT_DIR"

      - name: Fix Kotlin duplicate dependencies
        shell: bash
        run: |
          set -e

          echo "กำลังแก้ Kotlin duplicate classes..."

          cat >> "$PROJECT_DIR/app/build.gradle" <<'EOF'

          // Fix old Kotlin JDK7/JDK8 duplicate classes
          configurations.configureEach {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          EOF

          echo "แก้ Kotlin dependency เรียบร้อย"

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "เริ่ม Build APK..."
          echo "PROJECT_DIR=$PROJECT_DIR"

          gradle --version

          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "ค้นหา APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV1-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
