name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -o DustinBotV1_UI_READY_GitHub.zip -d project

          echo "=== Files after unzip ==="
          find project -maxdepth 5 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -type f | head -1)")

          echo "Found Android project:"
          echo "$PROJECT_DIR"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin duplicate dependencies
        run: |
          echo "Using project:"
          echo "$PROJECT_DIR"

          BUILD_FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found:"
            echo "$BUILD_FILE"
            exit 1
          fi

          echo "Fixing Kotlin dependencies in:"
          echo "$BUILD_FILE"

          cat >> "$BUILD_FILE" <<'EOF'

          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  if (requested.group == "org.jetbrains.kotlin") {
                      useVersion "1.8.22"
                  }
              }

              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }

          EOF

          echo "=== Final build.gradle ==="
          cat "$BUILD_FILE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          echo "Building from:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV1-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
