name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract V1.3
        shell: bash
        run: |
          set -e

          ZIP="DustinBotV1_V1.3_READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo "ZIP files available:"
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          rm -rf project
          mkdir project

          echo "Using EXACT project:"
          echo "$ZIP"

          unzip -o "$ZIP" -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT:"
          echo "$PROJECT_DIR"
          echo "================================"

          cat "$PROJECT_DIR/settings.gradle" || true
          echo
          find "$PROJECT_DIR/app/src/main" -type f -print

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle \
            -p "$PROJECT_DIR" \
            --init-script "$RUNNER_TEMP/fix.gradle" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Create dependency fix
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/fix.gradle" <<'EOF'
          allprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                  }
              }
          }
          EOF

      - name: Build APK Final
        shell: bash
        run: |
          set -e

          gradle \
            -p "$PROJECT_DIR" \
            --init-script "$RUNNER_TEMP/fix.gradle" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DustinBotV1-V1.3-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
